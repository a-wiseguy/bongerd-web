services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_USER: ${MYSQL_USER:-bongerd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bongerd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 30
    # mysql stays on the compose network only (no host ports)

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # always reach mysql via compose service hostname
      DATABASE_URL: mysql://${MYSQL_USER:-bongerd}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-bongerd}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
  uploads:

services:
  db:
    image: mysql:8.4
    network_mode: host
    command:
      - --port=53306
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_USER: bongerd
      MYSQL_PASSWORD: bongerd
      MYSQL_DATABASE: bongerd
      MYSQL_ROOT_PASSWORD: bongerd
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "53306", "-ubongerd", "-pbongerd"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: mysql://bongerd:bongerd@127.0.0.1:53306/bongerd
      SESSION_SECRET: local-docker-session-secret-min-32-characters
      COOKIE_SECURE: "false"
      ADMIN_EMAIL: beheer@apotheekdebongerd.nl
      ADMIN_PASSWORD: BongerdBeheer2026!
      SITE_URL: http://localhost:3000
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:

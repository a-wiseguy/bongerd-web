name: Security audit

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # prod deps only; dev tooling (drizzle-kit, vite) is not shipped
      - run: npm audit --omit=dev --audit-level=high
